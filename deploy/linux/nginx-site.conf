# /etc/nginx/sites-available/wings-git-manager
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 443 ssl http2;
  server_name git-manager.example.com;
  ssl_certificate     /etc/letsencrypt/live/git-manager.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/git-manager.example.com/privkey.pem;
  client_max_body_size 512m;
  proxy_read_timeout 900s;
  location /hubs/ {
    proxy_pass http://127.0.0.1:5380;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://127.0.0.1:5380;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
server { listen 80; server_name git-manager.example.com; return 301 https://$host$request_uri; }
